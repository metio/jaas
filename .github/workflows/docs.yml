name: Documentation
on:
  workflow_dispatch:
  schedule:
    # Daily rebuild so the generated pages (flags, chart values, JOI catalog)
    # pick up changes in the sibling repos with no cross-repo trigger and no
    # token to maintain. jaas's own changes still rebuild immediately via the
    # push paths below.
    - cron: 45 4 * * *
  push:
    branches: [main]
    paths:
      - .github/workflows/docs.yml
      - docs/**
      # The flags page is generated from the binary's FlagSet, so a flag change
      # must rebuild the site even though no docs/ file changed.
      - main.go
      - internal/cliflags/**
      - hack/flaggen/**
      - hack/flatten-schema.jq
      - hack/joi-images.jq
      - hack/gen-docs-data.sh
  pull_request:
    paths:
      - .github/workflows/docs.yml
      - docs/**
      - main.go
      - internal/cliflags/**
      - hack/flaggen/**
      - hack/flatten-schema.jq
      - hack/joi-images.jq
      - hack/gen-docs-data.sh
permissions:
  contents: read
jobs:
  website:
    name: Website
    uses: metio/ci/.github/workflows/hugo.yml@4ffe6343c7dad75502de503165b853f1959afc8c # 2026.11.21090200
    permissions:
      contents: write
    with:
      source: docs
      prepare: hack/gen-docs-data.sh
      cname: jaas.projects.metio.wtf
