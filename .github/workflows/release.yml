name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      needed: ${{ steps.gate.outputs.needed }}
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.gate.outputs.last }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: gate
        uses: metio/ci/needs-release@6e8776dc59abdfffa793903f100e89f1aacb9c2e # 2026.11.2023135
        with:
          paths: go.mod main.go internal api config Dockerfile
      - id: version
        if: steps.gate.outputs.needed == 'true'
        uses: metio/ci/calver@6e8776dc59abdfffa793903f100e89f1aacb9c2e # 2026.11.2023135
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        # The linux architectures of gcr.io/distroless/static, plus the desktop platforms.
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm
            goarm: "7"
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: ppc64le
          - goos: linux
            goarch: riscv64
          - goos: linux
            goarch: s390x
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: metio/ci/breto@6e8776dc59abdfffa793903f100e89f1aacb9c2e # 2026.11.2023135
        with:
          registries: github:metio/toolchains
      - name: Build and archive
        run: |
          set -euo pipefail
          ext=""
          [ "$GOOS" = windows ] && ext=".exe"
          ldflags="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA}"
          pack() {
            name="$1"; pkg="$2"
            go build -o "${name}_v${VERSION}${ext}" -trimpath -ldflags="${ldflags}" "${pkg}"
            if [ "$GOOS" = windows ]; then
              zip "${name}_${VERSION}_${GOOS}_${GOARCH}.zip" "${name}_v${VERSION}${ext}" LICENSE README.md
            else
              tar --create --gzip --file "${name}_${VERSION}_${GOOS}_${GOARCH}.tar.gz" "${name}_v${VERSION}${ext}" LICENSE README.md
            fi
          }
          pack jaas .
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          VERSION: ${{ needs.prepare.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          path: |
            *.tar.gz
            *.zip
  container:
    name: Container Release
    needs: [prepare, build]
    if: needs.prepare.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write # cosign keyless image signing
      contents: read
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: metio/ci/container-release@6e8776dc59abdfffa793903f100e89f1aacb9c2e # 2026.11.2023135
        with:
          image: ghcr.io/${{ github.repository }}
          version: ${{ needs.prepare.outputs.version }}
  github:
    name: GitHub Release
    # The notes name the image tag, so a failed image build skips the release.
    needs: [prepare, build, container]
    if: needs.prepare.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write # cosign keyless sign-blob
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SUMS: ${{ github.event.repository.name }}_${{ needs.prepare.outputs.version }}_SHA256SUMS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Calculate Checksums
        run: |
          cd dist
          shopt -s nullglob
          sha256sum ./*.tar.gz ./*.zip > "$SUMS"
      - uses: metio/ci/cosign-sign-blob@6e8776dc59abdfffa793903f100e89f1aacb9c2e # 2026.11.2023135
        with:
          file: dist/${{ github.event.repository.name }}_${{ needs.prepare.outputs.version }}_SHA256SUMS
      - id: notes
        uses: metio/ci/release-notes@6e8776dc59abdfffa793903f100e89f1aacb9c2e # 2026.11.2023135
        with:
          version: ${{ needs.prepare.outputs.version }}
          previous: ${{ needs.prepare.outputs.previous }}
      - name: Append usage and verification footer
        env:
          NOTES: ${{ steps.notes.outputs.file }}
        run: |
          cat >> "$NOTES" <<EOF

          ## Usage

          Pull the container from \`ghcr.io/metio/jaas:${VERSION}\`.
          See **Upgrading** — https://jaas.projects.metio.wtf/installation/upgrading/ — for any required actions on your part.

          Prebuilt binaries are attached below:

          - \`linux\`: \`amd64\`, \`arm\` (v7), \`arm64\`, \`ppc64le\`, \`riscv64\`, \`s390x\`
          - \`windows\`: \`amd64\`, \`arm64\` (\`.zip\`)
          - \`darwin\` (macOS): \`amd64\`, \`arm64\`

          ## Verify

          All release artifacts are signed with cosign keyless. See **Verifying releases** — https://jaas.projects.metio.wtf/installation/verifying-releases/ — for the verification commands.
          EOF
      - name: Create Release
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file "$NOTES" dist/*.tar.gz dist/*.zip "dist/$SUMS" "dist/$SUMS.bundle"
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.notes.outputs.file }}
